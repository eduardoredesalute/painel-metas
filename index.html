<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Metas das Unidades</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Fira+Sans+Condensed:wght@500;600&display=swap">
<style>
/* Layout: cabeçalho azul com linha amarela e abas; faixa compacta de lançamentos; por OKR uma faixa azul com letra branca e tabelas unidade × (meses consolidados | semanas do mês) */
:root{
  --navy:#0f2b5b; --navy-2:#173a78; --navy-soft:#e7edf7; --side-muted:#b4c3df;
  --yellow:#ffcc00; --yellow-2:#ffd633; --yellow-soft:#fff6cc; --on-yellow:#0f2b5b;
  --paper:#ffffff; --panel:#ffffff; --panel-2:#f4f6fa; --title:#13306b; --ink:#1d2b45; --muted:#5d6b82; --line:#dde3ec; --line-soft:#edf0f5;
  --focus:#2f6fd6; --scrim:rgba(8,20,45,.5);
  --ok:#14663f; --ok-bg:#d6f1e2; --warn:#7a5200; --warn-bg:#fff1c2; --bad:#8f1f33; --bad-bg:#f6d0d6; --none-bg:#eef1f6;
  --font:"Fira Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-cond:"Fira Sans Condensed","Fira Sans",system-ui,sans-serif;
  --r:10px; color-scheme:light;
}
:root[data-theme="dark"]{color-scheme:light}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
body.locked{overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* cabeçalho */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(90deg,var(--navy),var(--navy-2));color:#fff;border-top:3px solid var(--yellow)}
.top .bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.mark{width:36px;height:36px;border-radius:9px;background:#fff;display:grid;place-items:center;flex:none}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand span{display:block;font-size:12.5px;color:var(--side-muted)}
.top label{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted)}
.top select{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:6px 10px;min-height:34px;font-weight:600}
.top select option{color:var(--ink);background:#fff}
.who-me{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--side-muted)}
.who-me b{color:#fff;font-weight:600}
.avatar{width:30px;height:30px;border-radius:50%;border:2px solid var(--yellow);display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
.tab{border:0;background:none;color:var(--side-muted);padding:9px 12px;border-bottom:3px solid transparent;font-weight:500;cursor:pointer;white-space:nowrap}
.tab:hover{color:#fff}
.tab[aria-selected="true"]{color:#fff;font-weight:600;border-bottom-color:var(--yellow)}

main{padding-block:18px 48px;display:grid;gap:22px}
select,.inp{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-height:34px}
.inp[aria-invalid="true"]{border-color:var(--bad);background:var(--bad-bg)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:var(--r);padding:10px 14px;font-size:13.5px;font-weight:500}
.empty{padding:36px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 14px;min-height:34px;cursor:pointer;font-weight:600}
.btn.yellow{background:var(--yellow);color:var(--on-yellow);border-color:var(--yellow);font-weight:700}
.btn.yellow:hover{background:var(--yellow-2)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn:disabled{opacity:.6;cursor:default}
.btn.sm{min-height:30px;padding:4px 10px;font-size:13px}

/* faixa de lançamentos */
.launch{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.launch-h{background:var(--navy-soft);color:var(--title);font-weight:700;padding:8px 14px;font-size:13.5px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.launch-h span{font-weight:400;color:var(--muted);font-size:12.5px}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.slot{padding:10px 14px;display:grid;gap:6px;border-top:1px solid var(--line-soft);border-right:1px solid var(--line-soft);align-content:start;min-width:0}
.slot.open{background:var(--yellow-soft)}
.slot-t{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.slot-t b{color:var(--title);font-size:13.5px}
.slot-t small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.slot .d{font-size:12.5px;color:var(--muted)}

/* faixa OKR: azul com letra branca, como na planilha */
.okr{display:grid;gap:12px}
.okr-band{background:var(--navy);color:#fff;border-radius:8px;padding:9px 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;border-left:5px solid var(--yellow)}
.okr-band h2{margin:0;font-family:var(--font-cond);font-size:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.okr-band .sub{font-size:12.5px;color:var(--side-muted)}
.okr-band .score{margin-left:auto;font-size:12.5px;font-variant-numeric:tabular-nums}
.kr{border:1px solid var(--line);border-radius:var(--r);min-width:0;overflow:hidden}
.kr-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:9px 12px}
.kr-h h3{margin:0;font-size:15px;font-weight:700;color:var(--title)}
.kr-h .meta{color:var(--muted);font-size:12.5px}
.tag{font-size:11px;font-weight:600;color:var(--muted);background:var(--panel-2);border-radius:999px;padding:2px 8px;white-space:nowrap}
.scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;text-align:center;border-top:1px solid var(--line-soft);white-space:nowrap}
th{font-family:var(--font-cond);font-weight:600;font-size:12px;color:var(--muted);letter-spacing:.02em;vertical-align:bottom;background:var(--panel)}
th small{display:block;font-weight:500;font-size:11px}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;z-index:1;background:var(--panel);box-shadow:1px 0 0 var(--line-soft)}
tr.grp th{background:var(--navy-soft);color:var(--title);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;border-top:0;text-align:center}
tr.grp th.cur{background:var(--navy);color:#fff}
tr.grp th:first-child{background:var(--navy-soft)}
td.u{font-weight:600;color:var(--title)}
td.metac{color:var(--muted);font-weight:600}
.cur-start{border-left:2px solid var(--navy)!important}
.past{background:var(--panel-2)}
.v{display:inline-block;min-width:4.4em;padding:2px 6px;border-radius:5px}
.v.ok{background:var(--ok-bg);color:var(--ok);font-weight:600}
.v.bad{background:var(--bad-bg);color:var(--bad);font-weight:600}
.v.na{color:var(--muted)}
.raw{display:block;font-size:10.5px;color:var(--muted);margin-top:1px}
td.acc,th.acc{border-left:1px solid var(--line)}
td.acc .v{font-weight:700}
table.q th,table.q td{padding:5px 8px}
table.q th:first-child,table.q td:first-child{box-shadow:none}
table.q th.c-u,table.q td.c-u{position:sticky;left:0;z-index:2;width:128px;min-width:128px;max-width:128px;white-space:normal;text-align:center;vertical-align:middle;font-weight:700;color:var(--title);background:var(--panel-2);font-size:13px;letter-spacing:.02em;text-transform:uppercase;box-shadow:inset -1px 0 0 var(--line)}
table.q th.c-k,table.q td.c-k{position:sticky;left:128px;z-index:2;text-align:left;font-weight:600;color:var(--ink);background:var(--panel);box-shadow:inset -1px 0 0 var(--line);min-width:118px}
table.q thead .c-u,table.q thead .c-k{background:var(--navy-soft);z-index:3}
table.q tr.ufirst td{border-top:2px solid var(--line)}
table.q .mstart{border-left:1px solid var(--line)}
table.q td.res{background:var(--panel-2)}
table.q tr.sub th.res{background:var(--panel-2)}
.has-tip{cursor:help}
.tipbox{position:fixed;z-index:40;background:var(--navy);color:#fff;border-left:3px solid var(--yellow);border-radius:8px;padding:7px 11px;font-size:12.5px;line-height:1.5;white-space:pre;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.2)}
table.q td.editavel{cursor:pointer}
table.q td.editavel:hover{outline:2px solid var(--yellow);outline-offset:-2px}
table.q .vermeta{display:block;margin:3px auto 0;border:0;background:none;padding:0 2px;font:inherit;font-size:10.5px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
table.q .vermeta:hover{color:var(--title)}
table.q .v.top{display:block;width:fit-content;margin:0 auto 3px}
/* dados no mesmo tamanho da coluna Indicador */
table.q td,table.q .v,table.q td.c-k{font-size:14px}
table.q .raw{font-size:11.5px}
table.q .v.top.na{color:var(--ink)}
table.q tr.total td{background:var(--navy-soft);font-weight:700}
table.q tr.total.ufirst td{border-top:2px solid var(--navy)}
table.q tr.total td.c-u{background:var(--navy);color:#fff}
@media (max-width:640px){table.q th.c-k,table.q td.c-k{position:static}table.q th.c-u,table.q td.c-u{width:92px;min-width:92px;max-width:92px;font-size:11.5px}}
tr.total td{border-top:2px solid var(--navy);background:var(--navy-soft);font-weight:700}
tr.total td:first-child{background:var(--navy-soft)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle;background:currentColor}

/* resumo */
.mx th.grp{background:var(--navy);color:#fff;text-align:center;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;border-left:2px solid var(--panel)}

/* janela de lançamento */
#modal{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.dlg{background:var(--panel);border-radius:14px;width:min(100%,780px);display:grid;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.dlg-h{padding:16px 20px 14px;background:linear-gradient(90deg,var(--navy),var(--navy-2));color:#fff;border-top:3px solid var(--yellow);display:grid;gap:4px}
.dlg-h h2{margin:0;font-size:18px;font-weight:700}
.dlg-h p{margin:0;color:var(--side-muted);font-size:13px}
.dlg-unit{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:12px 20px;background:var(--panel-2);border-bottom:1px solid var(--line-soft)}
.dlg-unit label{font-weight:700;color:var(--title)}
.dlg-unit .who{font-size:12.5px;color:var(--muted)}
.dlg-b{padding:4px 20px 10px;display:grid;gap:4px}
.grp-h{font-family:var(--font-cond);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--navy);border-left:4px solid var(--yellow);border-radius:4px;padding:4px 10px;margin-top:14px}
.frow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.2fr) auto;gap:6px 12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.frow:last-child{border-bottom:0}
.frow .nm{font-weight:600;font-size:14px;color:var(--title)}
.frow .nm small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.fins{display:flex;flex-wrap:wrap;gap:6px 10px}
.fins label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.fins .inp{width:8.8em;text-align:right;font-variant-numeric:tabular-nums}
.prev{text-align:right;min-width:6.5em}
.dlg-f{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;padding:12px 20px 16px;border-top:1px solid var(--line-soft)}
.dlg-f .msg{margin-right:auto;font-size:13px}
@media (max-width:560px){.frow{grid-template-columns:1fr auto}.frow .fins{grid-column:1 / -1;order:3}}
.err-t{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;border-left:4px solid var(--yellow);padding:10px 18px;border-radius:10px;font-size:13.5px;z-index:30}

/* metas e calendário */
.okr-card{display:grid;gap:12px;min-width:0}
.okr-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;background:var(--navy);color:#fff;border-radius:8px;padding:10px 14px;border-left:5px solid var(--yellow)}
.okr-head .tt{flex:1 1 300px;min-width:0}
.okr-head h2{margin:0;font-family:var(--font-cond);font-size:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.okr-head p{margin:2px 0 0;font-size:12.5px;color:var(--side-muted)}
.okr-head .btn{background:#fff}
.okr-head .row span{color:var(--yellow)!important}
.kr>.tbl{border:0;border-radius:0}
.tbl{border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.form td{padding:5px 6px}
.form input.inp{width:6.8em;text-align:right;padding:5px 7px;font-variant-numeric:tabular-nums}
.cfg{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.card{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.card h3{margin:0;font-size:15px;color:var(--title)}
.card p{margin:0;color:var(--muted);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--panel-2);border-radius:999px;padding:3px 4px 3px 12px;font-size:13px;font-variant-numeric:tabular-nums}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 7px;font-size:16px;line-height:1}
.cal{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px 14px;align-items:center;font-size:13.5px}
.cal .inp{width:5.5em;text-align:right}
.cal .hd{color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
@media (max-width:640px){.who-me span{display:none}}

  supabaseUrl: "https://zdqqqxguytiobfscozrj.supabase.co",

<script>
/*
  Ponte entre o painel e o Supabase.
  O painel foi escrito para o banco do claude.ai (window.claude.use("db") e use("user")).
  Este arquivo oferece a mesma interface usando uma tabela "docs" no Supabase,
  com login por e-mail (link mágico) e atualização em tempo real.
  Também mistura os dados diários do Google (data/google.json) nos resultados.
*/
(function () {
  "use strict";
  const CFG = window.PAINEL_CONFIG || {};
  if (!window.supabase || !CFG.supabaseUrl || !CFG.supabaseAnonKey) {
    console.error("Configure js/config.js com a URL e a chave anon do Supabase.");
    return;
  }
  const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);

  /* ---------- estado ---------- */
  const store = new Map();          // "colecao/id" -> data
  const listeners = new Set();      // funções chamadas a cada mudança
  let usuarios = [];                // [{email, nome, admin}]
  let me = null;                    // {email, nome, admin}
  let google = null;                // conteúdo de data/google.json
  let resolveReady; const ready = new Promise(r => (resolveReady = r));

  const clone = o => JSON.parse(JSON.stringify(o));
  const isObj = v => v && typeof v === "object" && !Array.isArray(v);
  function deepMerge(base, patch) {
    const out = isObj(base) ? clone(base) : {};
    for (const k in patch) out[k] = isObj(patch[k]) && isObj(out[k]) ? deepMerge(out[k], patch[k]) : patch[k];
    return out;
  }
  const notify = () => listeners.forEach(f => { try { f(); } catch (e) { console.error(e); } });

  /* ---------- Google: snapshots diários -> colunas do mês ---------- */
  const pad = n => String(n).padStart(2, "0");
  function hojeISO() { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function overlayGoogle(id, data) {
    if (!google || !google.dias) return data;
    const mes = id.slice(0, 7), u = id.slice(8);
    const [y, m] = mes.split("-").map(Number);
    const ultimo = new Date(y, m, 0).getDate(), hoje = hojeISO();
    const dias = Object.keys(google.dias).filter(d => google.dias[d] && google.dias[d][u]).sort();
    if (!dias.length) return data;
    // último dado entre "de" e "lim" (datas AAAA-MM-DD), nunca no futuro
    const ate = (lim, de) => { let r = null; for (const d of dias) if (d >= (de || mes + "-01") && d <= lim && d <= hoje) r = d; return r; };
    const out = clone(data || {});
    let semana = 0, inicioSemana = mes + "-01";
    for (let dia = 1; dia <= ultimo; dia++) {
      if (new Date(y, m - 1, dia).getDay() !== 2) continue;
      semana++;
      const d = ate(mes + "-" + pad(dia), inicioSemana); // só dias desta semana (quarta a terça)
      inicioSemana = mes + "-" + pad(dia + 1);
      if (d) { const [nota, total] = google.dias[d][u]; out["w" + semana] = Object.assign({}, out["w" + semana], { google: total, googleNota: nota }); }
    }
    const fim = mes + "-" + pad(ultimo);
    if (hoje > fim) { const d = ate(fim); if (d) { const [nota, total] = google.dias[d][u]; out.fech = Object.assign({}, out.fech, { google: total, googleNota: nota }); } }
    // início do mês = último dado do mês anterior
    let ini = null; for (const d of dias) if (d < mes + "-01") ini = d;
    const ultimoDoMes = ate(fim);
    out.mes = Object.assign({}, out.mes);
    if (ini) out.mes.googleInicio = google.dias[ini][u][1];
    if (ultimoDoMes) out.mes.googleNota = google.dias[ultimoDoMes][u][0];
    return out;
  }
  function resultadosComGoogle() {
    const docs = new Map();
    for (const [k, v] of store) if (k.startsWith("resultados/")) docs.set(k.slice(11), v);
    if (google && google.dias) {
      // garante documento para meses/unidades que só têm dado do Google
      for (const d of Object.keys(google.dias)) for (const u of Object.keys(google.dias[d])) {
        const id = d.slice(0, 7) + "_" + u; if (!docs.has(id)) docs.set(id, {});
      }
    }
    return [...docs].map(([id, v]) => ({ id, data: overlayGoogle(id, v) }));
  }

  /* ---------- leitura ---------- */
  async function carregarTudo() {
    let from = 0; const page = 1000;
    for (;;) {
      const { data, error } = await sb.from("docs").select("collection,id,data").range(from, from + page - 1);
      if (error) throw error;
      data.forEach(r => store.set(r.collection + "/" + r.id, r.data || {}));
      if (data.length < page) break; from += page;
    }
    if (me && me.admin) { const u = await sb.from("usuarios").select("email,nome,admin"); usuarios = u.data || []; }
    // Google: lançado pelos líderes (sem arquivo automático)
  }
  function escutarMudancas() {
    sb.channel("docs-changes")
      .on("postgres_changes", { event: "*", schema: "public", table: "docs" }, p => {
        const row = p.new && p.new.collection ? p.new : p.old;
        if (!row || !row.collection) return;
        const key = row.collection + "/" + row.id;
        if (p.eventType === "DELETE") store.delete(key); else store.set(key, p.new.data || {});
        notify();
      })
      .subscribe();

  }

  /* ---------- escrita ---------- */
  function erro(e) {
    const err = new Error(e && e.message ? e.message : "Falha ao salvar");
    err.code = e && (e.code === "42501" || /row-level security|permission/i.test(e.message || "")) ? "invalid_argument" : "unavailable";
    return err;
  }
  async function gravar(col, id, data) {
    const row = { collection: col, id, data, updated_at: new Date().toISOString(), updated_by: me && me.email };
    const { error } = await sb.from("docs").upsert(row, { onConflict: "collection,id" });
    if (error) throw erro(error);
    store.set(col + "/" + id, data); notify();
  }
  async function lerDoServidor(col, id) {
    const { data, error } = await sb.from("docs").select("data").eq("collection", col).eq("id", id).maybeSingle();
    if (error) throw erro(error);
    return data ? data.data : null;
  }

  /* ---------- interface igual à do claude.ai ---------- */
  function snapDoc(col, id) {
    const v = col === "resultados" ? (resultadosComGoogle().find(d => d.id === id) || {}).data : store.get(col + "/" + id);
    return { id, exists: v !== undefined && v !== null, data: () => (v ? clone(v) : undefined) };
  }
  function docRef(col, id) {
    return {
      id,
      onSnapshot(cb) { const f = () => cb(snapDoc(col, id)); listeners.add(f); setTimeout(f, 0); return () => listeners.delete(f); },
      async get() { const v = await lerDoServidor(col, id); return { id, exists: !!v, data: () => (v ? clone(v) : undefined) }; },
      async set(data) { await gravar(col, id, clone(data)); },
      async update(patch) { const atual = (await lerDoServidor(col, id)) || {}; await gravar(col, id, deepMerge(atual, patch)); }
    };
  }
  const db = {
    collection(col) {
      return {
        doc: id => docRef(col, id),
        onSnapshot(cb) {
          const f = () => {
            const docs = col === "resultados" ? resultadosComGoogle()
              : [...store].filter(([k]) => k.startsWith(col + "/")).map(([k, v]) => ({ id: k.slice(col.length + 1), data: v }));
            cb({ docs: docs.map(d => ({ id: d.id, exists: true, data: () => clone(d.data) })), size: docs.length, empty: !docs.length });
          };
          listeners.add(f); setTimeout(f, 0); return () => listeners.delete(f);
        }
      };
    },
    doc(path) { const [col, id] = path.split("/"); return docRef(col, id); }
  };
  const user = {
    async id() { return me.admin ? me.email : null; },
    async isOwner() { return !!me.admin; },
    async can() { return true; },
    async me() { return { id: me.email, name: me.nome || me.email, avatarUrl: "" }; },
    async profiles(ids) { const o = {}; ids.forEach(i => { const u = usuarios.find(x => x.email.toLowerCase() === String(i).toLowerCase()); o[i] = { id: i, name: u ? (u.nome || u.email) : "" }; }); return o; }
  };
  window.claude = { use: async name => { await ready; return name === "db" ? db : name === "user" ? user : null; } };

  /* ---------- acesso ----------
     Líderes: abrem o link e lançam direto, sem login.
     Administrador: entra pelo botão "Admin" do cabeçalho (link por e-mail) para alterar metas. */
  function tela(html) {
    let el = document.getElementById("login");
    if (!el) { el = document.createElement("div"); el.id = "login"; document.body.append(el); }
    el.innerHTML = '<div class="login-card">' + html + "</div>";
    return el;
  }
  function loginAdmin() {
    const el = tela(
      '<h2>Entrar como administrador</h2><p>Para alterar metas, dias úteis e feriados. Você vai receber um link no e-mail.</p>' +
      '<form id="login-form"><label for="login-email">E-mail</label><input id="login-email" type="email" required autocomplete="email">' +
      '<button type="submit" class="btn yellow">Receber link de acesso</button></form><p class="login-msg" id="login-msg"></p>' +
      '<button type="button" class="btn ghost" id="login-fechar">Voltar ao painel</button>');
    el.querySelector("#login-fechar").onclick = () => el.remove();
    el.querySelector("#login-form").addEventListener("submit", async e => {
      e.preventDefault();
      const out = el.querySelector("#login-msg"); out.textContent = "Enviando…";
      const { error } = await sb.auth.signInWithOtp({ email: el.querySelector("#login-email").value.trim(), options: { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: true } });
      out.textContent = error ? "Não foi possível enviar: " + error.message : "Pronto. Abra o e-mail e clique no link para voltar ao painel como administrador.";
    });
  }
  function botaoCabecalho() {
    const box = document.getElementById("userbox"); if (!box || document.getElementById("btn-sair")) return;
    const b = document.createElement("button"); b.id = "btn-sair"; b.className = "sair"; b.type = "button";
    if (me.admin) { b.textContent = "Sair"; b.onclick = async () => { await sb.auth.signOut(); location.reload(); }; }
    else { b.textContent = "Admin"; b.title = "Entrar como administrador"; b.onclick = loginAdmin; }
    box.append(b);
  }
  async function iniciar(session) {
    me = { email: null, nome: "Liderança", admin: false };
    if (session) {
      const { data: u } = await sb.from("usuarios").select("email,nome,admin").ilike("email", session.user.email).maybeSingle();
      if (u && u.admin) me = u;
    }
    try { await carregarTudo(); }
    catch (e) { tela("<h2>Erro ao carregar</h2><p></p>").querySelector("p").textContent = e.message; return; }
    escutarMudancas();
    resolveReady();
    setTimeout(botaoCabecalho, 300);
  }
  let iniciado = false;
  sb.auth.getSession().then(({ data }) => { iniciado = true; iniciar(data.session); });
  sb.auth.onAuthStateChange((ev, session) => { if (ev === "SIGNED_IN" && iniciado && session && !(me && me.admin)) location.reload(); });
})();
</script>

<script>
(function(){
"use strict";
/* ---------- indicadores ---------- */
const OKRS=[
 {id:"comercial",nome:"Comercial",titulo:"Comercial",desc:"Vendas no PDV por dia útil e conversão em passes.",inds:[

   inputs:[{key:"pdv",label:"Quantidade de vendas PDV",kind:"int"}], metric:w=>w.pdv??null, target:m=>m},
  {id:"pdv",nome:"Vendas x DU",short:"Vendas x DU",agg:"sum",sub:"vendas por dia útil",fmt:"dec2",metaKind:"int",
   inputs:[], calc:"Calculado pelo painel: Total PDV ÷ dias úteis.",
   metric:(w,du)=>w.pdv!=null&&du?w.pdv/du:null, target:(m,c)=>m!=null&&c.duMes?m/c.duMes:null,
  },
  {id:"passes",nome:"% Passes",short:"% Passes",agg:"ratio",sub:"% das vendas PDV",fmt:"pct0",metaKind:"pct",
   inputs:[{key:"passes",label:"Quantidade de passes",kind:"int"}], calcNote:"O % é calculado pelo painel: passes ÷ Total PDV.",
   metric:w=>w.passes!=null&&w.pdv?w.passes/w.pdv:null, target:m=>m,

 {id:"exames",nome:"Exames",titulo:"Exames",desc:"Faturamento de exames em R$ por dia útil.",inds:[
  {id:"labus",nome:"Lab + US",agg:"sum",sub:"R$ por dia útil",fmt:"brl",metaKind:"dec",

 {id:"digital",nome:"Digitalização",split:true,titulo:"Digitalização",desc:"Atendimento digitalizado no consultório e uso do totem.",inds:[
  {id:"consultorio",nome:"Consultório",sub:"% digitalizado",fmt:"pct1",metaKind:"pct",

  {id:"totem",nome:"Totem",sub:"% de uso do totem",fmt:"pct1",metaKind:"pct",
   inputs:[{key:"totem",label:"% totem",kind:"pct"}], metric:w=>w.totem??null, target:m=>m}]},
 {id:"qualidade",nome:"Qualidade",split:true,titulo:"Qualidade",desc:"Avaliações no Google, índice de reclamações e cobrança de faltas.",inds:[
  {id:"google",nome:"Avaliações Google",sub:"novas avaliações por dia útil",fmt:"dec1",metaKind:"dec",
   inputs:[{key:"google",label:"Total de avaliações",kind:"int"},{key:"googleNota",label:"Nota no Google",kind:"dec"}],
   month:[{key:"googleInicio",label:"Total no início do mês",kind:"int"}],
   metric:(w,du,c)=>w.google!=null&&c.inicio!=null&&du?(w.google-c.inicio)/du:null, target:m=>m,
   raw:(w,c)=>{const p=[];if(w.google!=null&&c.inicio!=null)p.push("+"+fmt(w.google-c.inicio,"int")+" no mês");if(w.googleNota!=null)p.push("nota "+nf(1).format(w.googleNota));return p.length?p.join(" · "):null;}},
  {id:"reclam",nome:"Índice de reclamações",sub:"quanto menor, melhor",fmt:"pct2",metaKind:"pct",lower:true,
   inputs:[{key:"reclam",label:"% reclamações",kind:"pct"}], metric:w=>w.reclam??null, target:m=>m},
  {id:"faltas",nome:"Cobrança de faltas",sub:"% das faltas cobradas",fmt:"pct0",metaKind:"pct",
   inputs:[{key:"faltas",label:"Faltas acumuladas",kind:"int"},{key:"cobradas",label:"Faltas cobradas",kind:"int"}],
   metric:w=>w.faltas?(w.cobradas??0)/w.faltas:null, target:m=>m,
   raw:w=>w.faltas?fmt(w.cobradas??0,"int")+" de "+fmt(w.faltas,"int"):null}]}
];
const MENSAIS=["pdv","passes","labus","todos"];          // meta muda a cada mês
const FIXAS=["consultorio","totem","google","reclam","faltas"]; // meta fixa por unidade
const INDS=OKRS.flatMap(o=>o.inds.map(i=>Object.assign(i,{okr:o,fixa:FIXAS.includes(i.id)})));
const UNITS_DEFAULT=[["ALVORADA","Alvorada"],["ASSIS-BRASIL","Assis Brasil"],["CACHOEIRINHA","Cachoeirinha"],["CANOAS","Canoas"],["CAVALHADA","Cavalhada"],["CENTRO","Centro"],["GRAVATAI","Gravataí"],["RESTINGA","Restinga"],["VIAMAO","Viamão"]].map(([id,nome])=>({id,nome}));
const FERIADOS_PADRAO=["2026-01-01","2026-02-02","2026-02-16","2026-02-17","2026-04-03","2026-04-21","2026-05-01","2026-06-04","2026-09-07","2026-09-20","2026-10-12","2026-11-02","2026-11-20","2026-12-08","2026-12-25"];
const MESES_PT=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const DIAS_PT=["dom","seg","ter","qua","qui","sex","sáb"];

/* ---------- formatação ---------- */
const nf=(d)=>new Intl.NumberFormat("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
function fmt(v,k){
  if(v==null||!isFinite(v))return "—";
  switch(k){
    case "int":return nf(0).format(v);
    case "dec":return nf(v%1?2:0).format(v);
    case "dec1":return nf(1).format(v);
    case "dec2":return nf(1).format(v); // divisões: 1 casa decimal
    case "brl":return "R$ "+nf(0).format(v);
    case "pct":case "pct0":case "pct1":return nf(1).format(v*100)+"%"; // percentuais: 1 casa decimal
    case "pct2":return nf(2).format(v*100)+"%"; // índice de reclamações: 2 casas
  }
  return String(v);
}
function trimNum(x,dec){let s=x.toFixed(dec);if(s.includes("."))s=s.replace(/0+$/,"").replace(/\.$/,"");return s.replace(".",",");}
function toField(v,kind){
  if(v==null||!isFinite(v))return "";
  if(kind==="pct")return trimNum(v*100,2);
  if(kind==="int")return String(Math.round(v));
  return trimNum(v,2);
}
function parseField(s,kind){
  s=String(s).trim().replace(/R\$|%|\s/g,"");
  if(!s)return null;
  if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");
  const n=Number(s);
  if(!isFinite(n)||n<0)return NaN;
  if(kind==="pct")return +(n/100).toFixed(6);
  return n;
}
function metaText(ind,t){
  if(t==null)return "sem meta";
  return (ind.lower?"até ":"")+fmt(t,ind.fmt)+(ind.id==="pdv"?" por DU":"");
}
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const dm=d=>pad(d.getDate())+"/"+pad(d.getMonth()+1);
const dmw=d=>DIAS_PT[d.getDay()]+" "+dm(d);
function monthLabel(id){const [y,m]=id.split("-");return MESES_PT[+m-1]+"/"+y.slice(2);}
function shiftMonth(id,k){let [y,m]=id.split("-").map(Number);m+=k;while(m>12){m-=12;y++;}while(m<1){m+=12;y--;}return y+"-"+pad(m);}
const thisMonth=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1);};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);

/* ---------- estado ---------- */
const S={meses:{},metas:{},res:{},fixas:{},feriados:new Set(FERIADOS_PADRAO),units:UNITS_DEFAULT,mes:null,view:"painel",unit:null,
  open:new Set(),keepScroll:null,uid:null,canWrite:null,owner:false,ready:{meses:false,metas:false,res:false},hist:"pdv",pending:false};
try{const v=localStorage.getItem("metas.unit");if(v)S.unit=v;const t=localStorage.getItem("metas.view");if(t)S.view=t;const h=localStorage.getItem("metas.hist");if(h)S.hist=h;}catch(e){}
let db=null,user=null;

/* ---------- calendário: semana fecha na terça, reunião na quarta ---------- */
function isDU(d){const w=d.getDay();return w!==0&&w!==6&&!S.feriados.has(iso(d));}
function calendar(mes){
  const [y,m]=mes.split("-").map(Number), last=new Date(y,m,0).getDate();
  let du=0;const weeks=[];
  for(let day=1;day<=last;day++){
    const d=new Date(y,m-1,day);
    if(isDU(d))du++;
    if(d.getDay()===2)weeks.push({ate:d,du});
  }
  return {du,weeks};
}
function cols(mes){
  const cal=calendar(mes), ov=S.meses[mes]||{}, ovw=Array.isArray(ov.semanasDu)?ov.semanasDu:[];
  const duMes=(ov.du!=null&&ov.du!=="")?+ov.du:cal.du;
  const out=cal.weeks.map((w,i)=>{
    const abre=addDays(w.ate,1);
    return {key:"w"+(i+1),n:i+1,label:(i+1)+"ª sem.",sub:"até "+dm(w.ate),ate:w.ate,
      du:(ovw[i]!=null&&ovw[i]!=="")?+ovw[i]:w.du,duAuto:w.du,abre,fecha:addDays(abre,7)};
  });
  const [y,m]=mes.split("-").map(Number), fim=new Date(y,m,0), abreF=new Date(y,m,1);
  out.push({key:"fech",n:0,label:"Fechamento",sub:"mês completo",ate:fim,du:duMes,duAuto:cal.du,abre:abreF,fecha:addDays(abreF,7)});
  return out;
}
function janela(c){const now=new Date();if(now<c.abre)return "future";if(now<c.fecha)return "open";return "closed";}
function duMes(mes){return cols(mes).at(-1).du;}

/* ---------- cálculos ---------- */
function ctx(mes,u){const r=S.res[mes+"_"+u]||{};return {duMes:duMes(mes),inicio:r.mes?.googleInicio??null};}
function metaRaw(mes,u,ind){
  if(ind.fixa){const f=S.fixas[u];if(f&&f[ind.id]!=null)return f[ind.id];}
  const k=ind.metaKey||ind.id,m=S.metas[mes+"_"+u];return m&&m[k]!=null?m[k]:null;
}
function targetOf(mes,u,ind){return ind.target(metaRaw(mes,u,ind),ctx(mes,u));}
// meta da coluna: para totais, proporcional aos dias úteis até a semana
function tgt(mes,u,ind,col){const t=targetOf(mes,u,ind);if(t==null||!ind.prorate||!col||col.key==="fech")return t;const d=duMes(mes);return d?t*col.du/d:t;}
function cell(mes,u,ind,col){
  const r=S.res[mes+"_"+u]||{}, w=r[col.key]||{}, c=ctx(mes,u);
  const v=ind.metric(w,col.du,c);
  return {v:(v==null||!isFinite(v))?null:v, raw:ind.raw?ind.raw(w,c):null, tip:ind.tip?ind.tip(w):null};
}
function status(ind,v,t){if(v==null||t==null)return "na";return (ind.lower?v<=t+1e-12:v>=t-1e-12)?"ok":"bad";}
function acumulado(mes,u,ind){
  const cs=cols(mes);
  for(let i=cs.length-1;i>=0;i--){const x=cell(mes,u,ind,cs[i]);if(x.v!=null)return Object.assign(x,{col:cs[i]});}
  return {v:null,raw:null};
}
function filled(mes,col){return S.units.filter(u=>{const w=(S.res[mes+"_"+u.id]||{})[col.key];return w&&Object.keys(w).some(k=>w[k]!=null);}).length;}
const canInsert=()=>!!db&&S.canWrite!==false;

/* ---------- DOM ---------- */
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  if(attrs)for(const k in attrs){const a=attrs[k];if(a==null||a===false)continue;
    if(k==="class")e.className=a;else if(k==="text")e.textContent=a;else if(k.startsWith("on"))e.addEventListener(k.slice(2),a);else e.setAttribute(k,a===true?"":a);}
  for(const k of kids.flat()){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(String(k)));}
  return e;
}
function vSpan(ind,v,t){
  const st=status(ind,v,t);
  const s=h("span",{class:"v "+st},fmt(v,ind.fmt));
  if(st!=="na")s.setAttribute("aria-label",fmt(v,ind.fmt)+(st==="ok"?", meta atingida":", fora da meta"));
  return s;
}
// balão com a meta aberta em Laboratório e US (quando a meta foi lançada separada)
function labTip(mes,uids){let l=0,us=0,n=0;uids.forEach(u=>{const m=S.metas[mes+"_"+u];if(m&&(m.lab!=null||m.us!=null)){l+=m.lab||0;us+=m.us||0;n++;}});return n?"Laboratório: R$ "+nf(0).format(l)+"\nUS: R$ "+nf(0).format(us):null;}
function metaTd(cls,txt,tip){const td=h("td",{class:cls},txt);if(tip){td.classList.add("has-tip");td.setAttribute("data-tip",tip);td.setAttribute("tabindex","0");td.setAttribute("aria-label",txt+". "+tip.replace("\n",", "));}return td;}
(function(){
  const tip=document.createElement("div");tip.className="tipbox";tip.setAttribute("role","tooltip");tip.hidden=true;document.body.append(tip);
  function show(el){tip.textContent=el.getAttribute("data-tip");tip.hidden=false;const r=el.getBoundingClientRect(),w=tip.offsetWidth,hh=tip.offsetHeight;
    let x=r.left+r.width/2-w/2;x=Math.max(8,Math.min(x,innerWidth-w-8));let y=r.top-hh-8;if(y<8)y=r.bottom+8;tip.style.left=x+"px";tip.style.top=y+"px";}
  const hide=()=>{tip.hidden=true;};

function launchBar(mes){

function pastMonths(mes){
  const y=mes.slice(0,4), have=new Set(monthIds());
  const out=[];for(let m=1;m<+mes.slice(5);m++){const id=y+"-"+pad(m);if(have.has(id))out.push(id);}

// célula de resultado: % passes mostra a quantidade em cima e o % colorido embaixo, como na planilha
function resCell(ind,x,t,cls){
  const td=h("td",{class:cls||null});
  if(ind.id==="passes"&&x.raw){td.append(h("span",{class:"v top "+status(ind,x.v,t)},x.raw.replace(" passes","")));td.append(vSpan(ind,x.v,t));}
  else{td.append(vSpan(ind,x.v,t));if(x.raw)td.append(h("small",{class:"raw"},x.raw));}
  if(x.tip){td.setAttribute("data-tip",x.tip);td.classList.add("has-tip");}

// soma da rede: "sum" soma valores e metas; "ratio" (passes) = Σpasses / Σvendas
function totalOf(mes,ind,colOf){
  let v=0,t=0,n=0,nt=0,pa=0,pd=0,meta=null;
  S.units.forEach(u=>{
    const col=colOf(u.id);if(!col)return;
    if(ind.agg==="ratio"){const w=(S.res[mes+"_"+u.id]||{})[col.key]||{};if(w.passes!=null&&w.pdv){pa+=w.passes;pd+=w.pdv;n++;}if(meta==null)meta=metaRaw(mes,u.id,ind);return;}
    const x=cell(mes,u.id,ind,col);if(x.v==null)return;v+=x.v;n++;
    const tt=tgt(mes,u.id,ind,col);if(tt!=null){t+=tt;nt++;}
  });
  if(ind.agg==="ratio")return {v:pd?pa/pd:null,t:meta,raw:pd?fmt(pa,"int"):null};
  return {v:n?v:null,t:nt?t:null,raw:null};
}

const queues={};

  const hr2=h("tr",{},h("th",{},"Unidade"));fi.forEach(i=>hr2.append(h("th",{},i.nome,h("small",{},hint(i)))));
  const tb2=h("tbody");
  S.units.forEach(u=>{const tr=h("tr",{},h("td",{class:"u"},u.nome));
    fi.forEach(i=>tr.append(h("td",{},metaInput("mf-"+u.id+"-"+i.id,S.fixas[u.id]?.[i.id],kindOf(i),"Meta fixa "+i.nome+" · "+u.nome,v=>saveFixa(u.id,i.id,v)))));
    tb2.append(tr);});
  app.append(h("section",{class:"okr-card"},h("div",{class:"okr-head"},h("div",{class:"tt"},h("h2",{},"Metas fixas"),h("p",{},"Digitalização e Qualidade. Valem para todos os meses até você mudar."))),
    h("div",{class:"kr"},h("div",{class:"tbl"},h("table",{class:"form"},h("thead",{},hr2),tb2)))));
  // calendário
  const cs=cols(mes), ov=S.meses[mes]||{};
  const cal=h("div",{class:"cal"},h("span",{class:"hd"},"Período"),h("span",{class:"hd"},"Dados até"),h("span",{class:"hd"},"DU automático"),h("span",{class:"hd"},"DU ajustado"));
  const overrides=cs.filter(c=>c.key!=="fech").map((c,i)=>Array.isArray(ov.semanasDu)?ov.semanasDu[i]??null:null);
  let duOv=ov.du??null;
  async function saveCal(){await db.doc("meses/"+mes).set({du:duOv,semanasDu:overrides});S.meses[mes]={du:duOv,semanasDu:overrides.slice()};toast("Calendário salvo");}
  cs.forEach((c,i)=>{
    const isF=c.key==="fech";
    const el=h("input",{class:"inp",id:"du-"+c.key,inputmode:"numeric",placeholder:String(c.duAuto),value:(isF?duOv:overrides[i])??"","aria-label":"Dias úteis ajustados "+c.label});
    el.addEventListener("change",async()=>{const n=parseField(el.value,"int");if(Number.isNaN(n)){el.setAttribute("aria-invalid","true");return;}el.removeAttribute("aria-invalid");
      if(isF)duOv=n;else overrides[i]=n;try{await saveCal();render();}catch(e){toast("Não foi possível salvar");}});
    cal.append(h("span",{},isF?"Mês inteiro":c.label),h("span",{},dmw(c.ate)),h("span",{},String(c.duAuto)),el);
  });
  const chips=h("div",{class:"chips"});
  const [y,mm]=mes.split("-");
  const doMes=[...S.feriados].filter(d=>d.startsWith(y+"-"+mm)).sort();
  async function saveFer(list){await db.doc("config/feriados").set({datas:list});S.feriados=new Set(list);render();}
  doMes.forEach(d=>{const [yy,m2,dd]=d.split("-");chips.append(h("span",{class:"chip"},dd+"/"+m2+" "+DIAS_PT[new Date(+yy,+m2-1,+dd).getDay()],
    h("button",{type:"button","aria-label":"Remover feriado "+dd+"/"+m2,onclick:()=>saveFer([...S.feriados].filter(x=>x!==d)).catch(()=>toast("Não foi possível salvar"))},"×")));});
  if(!doMes.length)chips.append(h("span",{style:"color:var(--muted);font-size:13px"},"Nenhum feriado neste mês."));
  const nd=h("input",{class:"inp",type:"date",id:"novo-feriado",min:y+"-"+mm+"-01",max:y+"-"+mm+"-"+pad(new Date(+y,+mm,0).getDate())});
  app.append(h("div",{class:"cfg"},
    h("section",{class:"card"},h("h3",{},"Semanas de "+monthLabel(mes)),
      h("p",{},"A semana fecha na terça e a reunião é na quarta. Os dias úteis contam de segunda a sexta, sem os feriados. Preencha DU ajustado só se precisar mudar o número."),cal),
    h("section",{class:"card"},h("h3",{},"Feriados de "+monthLabel(mes)),
      h("p",{},"Feriados não contam como dia útil em nenhuma unidade."),chips,
      h("div",{class:"row"},nd,h("button",{class:"btn",type:"button",onclick:()=>{if(!nd.value)return;saveFer([...new Set([...S.feriados,nd.value])]).catch(()=>toast("Não foi possível salvar"));}},"Adicionar feriado")))));
}

/* ---------- render ---------- */
function monthIds(){
  const set=new Set(Object.keys(S.meses));
  Object.keys(S.metas).forEach(k=>set.add(k.slice(0,7)));
  Object.keys(S.res).forEach(k=>set.add(k.slice(0,7)));
  set.add(thisMonth());
  if(S.owner)set.add(shiftMonth(thisMonth(),1));
  return [...set].filter(x=>/^\d{4}-\d{2}$/.test(x)).sort().reverse();
}
function render(){
  const app=document.getElementById("app");
  const a=document.activeElement;
  if(!document.getElementById("modal").hidden||(a&&a.matches&&a.matches("#app input.inp"))){S.pending=true;return;}
  S.pending=false;
  document.getElementById("t-cfg").hidden=!S.owner;
  if(S.view==="cfg"&&!S.owner)S.view="painel";
  if(S.view!=="painel"&&S.view!=="cfg")S.view="painel";
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.v===S.view)));
  const fresh=h("main",{class:"wrap",id:"app"});
  if(!db){fresh.append(h("div",{class:"empty"},"Não foi possível conectar ao banco de dados. Verifique a internet e recarregue a página."));app.replaceWith(fresh);return;}
  if(!(S.ready.meses&&S.ready.metas&&S.ready.res)){fresh.append(h("div",{class:"empty"},"Carregando metas e resultados…"));app.replaceWith(fresh);return;}
  const ids=monthIds();
  if(!S.mes||!ids.includes(S.mes))S.mes=ids.includes(thisMonth())?thisMonth():ids[0];
  const sel=document.getElementById("mes");
  sel.replaceChildren(...ids.map(id=>{const o=h("option",{value:id},monthLabel(id));if(id===S.mes)o.selected=true;return o;}));
  document.getElementById("sub").textContent="Acompanhamento semanal por OKR · "+monthLabel(S.mes)+" · "+duMes(S.mes)+" dias úteis";
  if(S.view==="painel")renderPainel(fresh);else renderCfg(fresh);
  app.replaceWith(fresh);
  // abre as tabelas mostrando o mês atual (à direita), mantendo os meses anteriores a uma rolagem
  if(S.view==="painel"){const keep=S.keepScroll;S.keepScroll=null;requestAnimationFrame(()=>fresh.querySelectorAll(".scroll").forEach((e,i)=>{e.scrollLeft=keep&&keep[i]!=null?keep[i]:e.scrollWidth;}));}
}
document.addEventListener("focusout",()=>{setTimeout(()=>{const a=document.activeElement;if(S.pending&&document.getElementById("modal").hidden&&!(a&&a.matches&&a.matches("#app input.inp")))render();},0);});
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{S.view=t.dataset.v;try{localStorage.setItem("metas.view",S.view);}catch(_){}const a=document.activeElement;if(a&&a.blur)a.blur();S.pending=false;render();window.scrollTo({top:0});}));
document.getElementById("mes").addEventListener("change",e=>{S.mes=e.target.value;render();});
// a janela das semanas muda com o relógio: reavalia a cada 5 minutos
setInterval(()=>{if(db&&S.view==="painel")render();},300000);

/* ---------- dados ---------- */
(async function boot(){
  const cl=window.claude;
  if(!cl||!cl.use){render();return;}
  [db,user]=await Promise.all([cl.use("db"),cl.use("user")]);
  if(user){
    try{S.uid=await user.id();}catch(_){}
    try{S.owner=await user.isOwner();}catch(_){}
    try{S.canWrite=await user.can("data.write");}catch(_){}
    try{
      const me=await user.me();
      const nome=me.name||"Você";
      document.getElementById("u-name").textContent=nome;
      document.getElementById("u-role").textContent=S.owner?"Dono · define metas":(S.canWrite===false?"Somente leitura":"Liderança · insere dados");
      const av=document.getElementById("u-av");
      if(me.avatarUrl){const im=document.createElement("img");im.src=me.avatarUrl;im.alt="";av.replaceChildren(im);}else av.textContent=nome.charAt(0).toUpperCase();
      document.getElementById("userbox").hidden=false;
    }catch(_){}
  }
  if(!db){render();return;}
  const sub=(name,key,cb)=>db.collection(name).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data();});cb(o);S.ready[key]=true;render();},
    err=>{if(err&&err.code==="revoked")return;S.ready[key]=true;render();});
  sub("meses","meses",o=>{S.meses=o;});
  sub("metas","metas",o=>{S.metas=o;});
  sub("resultados","res",o=>{S.res=o;});
  db.doc("config/geral").onSnapshot(s=>{const d=s.exists?s.data():null;if(d&&Array.isArray(d.unidades)&&d.unidades.length){S.units=d.unidades;render();}},()=>{});
  db.doc("config/metasFixas").onSnapshot(s=>{S.fixas=s.exists?(s.data()||{}):{};render();},()=>{});
  db.doc("config/feriados").onSnapshot(s=>{const d=s.exists?s.data():null;if(d&&Array.isArray(d.datas))S.feriados=new Set(d.datas);render();},()=>{});
  render();
})();
})();
</script>
